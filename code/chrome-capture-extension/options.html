<!-- Nexus Capture - options page
     Minimal settings page: one field for the capture token. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Capture - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
      background: #ffffff;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    p.description {
      color: #555;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 20px;
      font-size: 14px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      display: inline-block;
      margin-left: 12px;
      font-size: 13px;
      color: #2a7d2a;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <h1>Nexus Capture</h1>
  <p class="description">
    Paste the capture token for your Nexus server below. This lets the
    extension authenticate when it sends captured claude.ai conversations.
  </p>

  <label for="token">Capture token</label>
  <input type="text" id="token" placeholder="Enter your capture token" autocomplete="off" />

  <div>
    <button id="save">Save</button>
    <span id="status">Saved</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
