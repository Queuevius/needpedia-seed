<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Needpedia · AI Text Studio</title>
<style>
  :root {
    --bg:       #0d0d0d;
    --surface:  #1a1a1a;
    --surface2: #242424;
    --surface3: #2e2e2e;
    --accent:   #4f8ef7;
    --accent2:  #7c3aed;
    --text:     #e8e8e8;
    --muted:    #888;
    --border:   #333;
    --danger:   #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }

  /* ── Top bar ── */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.2rem; height: 52px; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
  .topbar a { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .topbar a:hover { color: var(--text); }
  .topbar .sep { color: var(--border); }
  .topbar .title { font-weight: 600; font-size: 1rem; color: var(--text); }
  .topbar .user-badge { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: .25rem .85rem; font-size: .8rem; color: var(--muted); }

  /* ── Login overlay ── */
  #login-screen { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 1rem; }
  .login-box h2 { font-size: 1.2rem; text-align: center; }
  .login-box p { font-size: .85rem; color: var(--muted); text-align: center; }
  .login-box input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .7rem 1rem; color: var(--text); font-size: .95rem; width: 100%; }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-box button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: .75rem; font-size: .95rem; cursor: pointer; font-weight: 600; }
  .login-box button:hover { opacity: .9; }
  .login-error { color: var(--danger); font-size: .85rem; text-align: center; min-height: 1.2em; }

  /* ── Main layout ── */
  .studio { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: .9rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header span { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .new-chat-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: .3rem .7rem; font-size: .8rem; cursor: pointer; }
  .new-chat-btn:hover { opacity: .9; }
  .conv-list { flex: 1; overflow-y: auto; padding: .5rem; }
  .conv-item { padding: .6rem .8rem; border-radius: 8px; cursor: pointer; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item:hover { background: var(--surface2); color: var(--text); }
  .conv-item.active { background: var(--surface3); color: var(--text); }
  .conv-empty { padding: 1rem; font-size: .8rem; color: var(--muted); text-align: center; }

  /* ── Chat area ── */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Model selector ── */
  .model-bar { padding: .6rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .5rem; background: var(--surface); flex-shrink: 0; }
  .model-bar label { font-size: .8rem; color: var(--muted); }
  .model-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: .3rem .8rem; font-size: .8rem; cursor: pointer; }
  .model-btn.active { border-color: var(--accent); color: var(--accent); background: var(--surface3); }
  .model-btn:hover:not(.active) { border-color: var(--muted); }

  /* ── Messages ── */
  .messages { flex: 1; overflow-y: auto; padding: 1.5rem 1.2rem; display: flex; flex-direction: column; gap: 1rem; }
  .msg { display: flex; gap: .75rem; max-width: 800px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .75rem 1rem; font-size: .9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .msg-bubble { background: var(--surface3); border-color: var(--accent2); }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .75rem; flex-shrink: 0; margin-top: 2px; }
  .msg.assistant .msg-avatar { background: var(--accent); }
  .msg.user .msg-avatar { background: var(--accent2); }
  .thinking { color: var(--muted); font-style: italic; font-size: .85rem; }

  /* ── Input bar ── */
  .input-bar { padding: 1rem 1.2rem; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; gap: .75rem; align-items: flex-end; }
  .input-bar textarea { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: .75rem 1rem; font-size: .9rem; resize: none; min-height: 44px; max-height: 160px; line-height: 1.5; font-family: inherit; }
  .input-bar textarea:focus { outline: none; border-color: var(--accent); }
  .send-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn:hover { opacity: .9; }
  .send-btn:disabled { opacity: .4; cursor: default; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: .5rem; }
  .empty-state .icon { font-size: 2.5rem; }
  .empty-state p { font-size: .9rem; }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>🤖 AI Text Studio</h2>
    <p>Needpedia Volunteer Access</p>
    <input type="text" id="login-user" placeholder="Username" autocomplete="username">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<!-- Top bar -->
<div class="topbar">
  <a href="/">← Nexus</a>
  <span class="sep">·</span>
  <span class="title">AI Text Studio</span>
  <span class="user-badge" id="user-badge">not signed in</span>
  <button id="logout-btn" onclick="logoutStudio()" style="margin-left:.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:.25rem .85rem; font-size:.8rem; color:var(--muted); cursor:pointer;">Logout</button>
</div>

<!-- Studio -->
<div class="studio" id="studio" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Conversations</span>
      <button class="new-chat-btn" onclick="newChat()">+ New</button>
    </div>
    <div class="conv-list" id="conv-list">
      <div class="conv-empty">No conversations yet</div>
    </div>
  </div>
  <div class="chat-area">
    <div class="model-bar">
      <label>Model:</label>
      <button class="model-btn" data-model="qwen/qwen3-235b-a22b-2507" onclick="setModel(this)">Eco &middot; Qwen 3 235B</button>
      <button class="model-btn" data-model="anthropic/claude-sonnet-4-6" onclick="setModel(this)">Normal &middot; Claude Sonnet 4.6</button>
      <button class="model-btn" data-model="anthropic/claude-opus-4-8" onclick="setModel(this)">Power &middot; Claude Opus 4.8</button>
      <button class="model-btn active" data-model="deepseek/deepseek-v4-pro-0813" onclick="setModel(this)">DeepSeek V4 Pro 0813</button>
      <button class="model-btn" id="web-btn" data-on="1" onclick="toggleWeb(this)">Web: ON</button>
    </div>
    <script>
      function toggleWeb(b){
        b.dataset.on = (b.dataset.on === '1') ? '0' : '1';
        b.textContent = 'Web: ' + (b.dataset.on === '1' ? 'ON' : 'OFF');
      }
      function webIsOn(){
        var b = document.getElementById('web-btn');
        return !!b && b.dataset.on === '1';
      }
    </script>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="icon">🤖</div>
        <p>Start a new conversation</p>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="msg-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>
</div>

<script>
const ORDER_SERVER = '/volunteer-auth';
const LOG_SERVER   = '/volunteer-log';
const SAVE_SERVER  = '/save-text';

let currentUser = null;
let conversations = [];
let activeConvId  = null;
let selectedModel = 'deepseek/deepseek-v4-pro-0813';

// ── Login ──
async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  if (!username || !password) { err.textContent = 'Enter username and password.'; return; }
  try {
    const r = await fetch('/volunteer-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (r.ok) {
      currentUser = username;
      sessionStorage.setItem('np_volunteer', username);
      showStudio();
    } else {
      err.textContent = 'Invalid credentials.';
    }
  } catch(e) {
    err.textContent = 'Could not reach server.';
  }
}

function logoutStudio() {
  sessionStorage.removeItem('np_volunteer');
  window.location.href = '/';
}

function showStudio() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('studio').style.display = 'flex';
  const m = (currentUser || '').match(/(\d+)/);
  document.getElementById('user-badge').textContent = m ? ('Volunteer Studio ' + m[1]) : currentUser;
  loadConversations();
}

// ── Auto-login from session ──
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const urlUser = params.get('user');
  if (urlUser) { sessionStorage.setItem('np_volunteer', urlUser); currentUser = urlUser; showStudio(); }
  else {
    const saved = sessionStorage.getItem('np_volunteer');
    if (saved) { currentUser = saved; showStudio(); }
    else { document.getElementById('login-screen').style.display = 'flex'; }
  }
  const ta = document.getElementById('msg-input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });
});

// ── Model ──
function setModel(btn) {
  document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedModel = btn.dataset.model;
}

// ── Conversations ──
async function loadConversations() {
  conversations = [];
  try {
    const r = await fetch('/volunteer-convs?user=' + encodeURIComponent(currentUser));
    if (r.ok) {
      const rows = await r.json();
      conversations = rows.map(x => ({
        id: x.convo_id, convo_id: x.convo_id,
        title: x.title || 'Untitled', messages: null
      }));
    }
  } catch (e) { console.error('convs load failed', e); }
  renderConvList();
  if (conversations.length) activateConv(conversations[0].id);
}

function saveConversations() {
  sessionStorage.setItem('np_convs_' + currentUser, JSON.stringify(conversations));
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  if (!conversations.length) { list.innerHTML = '<div class="conv-empty">No conversations yet</div>'; return; }
  list.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.id === activeConvId ? 'active' : ''}" onclick="activateConv('${c.id}')">
      ${c.title}
    </div>
  `).join('');
}

function newChat() {
  const id = 'conv_' + Date.now();
  const convo_id = id + '_' + Math.random().toString(36).slice(2, 8);
  conversations.unshift({ id: convo_id, convo_id, title: 'New conversation', messages: [] });
  saveConversations();
  activateConv(convo_id);
}

async function activateConv(id) {
  activeConvId = id;
  renderConvList();
  const conv = getActiveConv();
  if (conv && conv.messages === null) {
    conv.messages = [];
    renderMessages();
    try {
      const r = await fetch('/volunteer-conv?user=' + encodeURIComponent(currentUser)
                            + '&id=' + encodeURIComponent(conv.convo_id));
      if (r.ok) {
        const data = await r.json();
        conv.messages = data.messages || [];
      }
    } catch (e) { console.error('conv load failed', e); }
  }
  renderMessages();
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

// ── Messages ──
function renderMessages() {
  const conv = getActiveConv();
  const box  = document.getElementById('messages');
  const empty = document.getElementById('empty-state');
  if (!conv || !conv.messages.length) {
    box.innerHTML = '';
    if (empty) { box.appendChild(empty); empty.style.display = 'flex'; }
    return;
  }
  if (empty) empty.style.display = 'none';
  box.innerHTML = conv.messages.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-avatar">${m.role === 'user' ? '👤' : '🤖'}</div>
      <div class="msg-bubble">${escHtml(m.content)}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || !currentUser) return;
  if (!activeConvId || !getActiveConv()) newChat();

  const conv = getActiveConv();
  if (!conv) return;
  conv.messages.push({ role: 'user', content: text });
  if (conv.title === 'New conversation') conv.title = text.slice(0, 40);
  input.value = '';
  input.style.height = 'auto';
  saveConversations();
  renderMessages();

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  // Thinking indicator
  const box = document.getElementById('messages');
  const thinking = document.createElement('div');
  thinking.className = 'msg assistant';
  thinking.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble thinking">Thinking…</div>';
  box.appendChild(thinking);
  box.scrollTop = box.scrollHeight;

  const bubble = thinking.querySelector('.msg-bubble');
  if (webIsOn()) bubble.textContent = 'Thinking… (may search the web — hard questions can take a few minutes)';
  try {
    const r = await fetch('/volunteer-chat-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        messages: conv.messages.map(m => ({ role: m.role, content: m.content })),
        web: webIsOn()
      })
    });
    if (!r.ok) {
      let msg = 'The server answered with code ' + r.status + '.';
      if (r.status === 504 || r.status === 524) msg = 'This took too long to answer. Please try again.';
      try {
        const j = await r.json();
        if (j.error) msg = (typeof j.error === 'string') ? j.error : (j.error.message || msg);
      } catch(_) {}
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', reply = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        let j;
        try { j = JSON.parse(d); } catch(_) { continue; }
        if (j.error) throw new Error(j.error.message || 'The AI service reported a problem.');
        const piece = j.choices?.[0]?.delta?.content;
        if (piece) {
          if (!reply) bubble.classList.remove('thinking');
          reply += piece;
          bubble.textContent = reply;
          box.scrollTop = box.scrollHeight;
        }
      }
    }
    if (!reply) reply = '[No response]';
    conv.messages.push({ role: 'assistant', content: reply });
    saveConversations();
    await logEntry({ type: 'text', model: selectedModel, user_msg: text, reply });
    await saveText(conv, text, reply);
  } catch(e) {
    conv.messages.push({ role: 'assistant', content: '[Error: ' + e.message + ']' });
    saveConversations();
  }

  btn.disabled = false;
  renderMessages();
}

// ── Persistent save ──
async function saveText(conv, user_msg, reply) {
  if (!conv || !conv.convo_id) return;
  try {
    await fetch('/save-text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username:  currentUser,
        convo_id:  conv.convo_id,
        title:     conv.title,
        model:     selectedModel,
        user_msg:  user_msg,
        reply:     reply
      })
    });
  } catch(e) {}
}

// ── Logging ──
async function logEntry(entry) {
  try {
    await fetch('/volunteer-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser, entry })
    });
  } catch(e) {}
}
</script>
</body>
</html>
