<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Needpedia Admin Chat</title>
<style>
  :root{--bg:#0d0d0d;--surface:#1a1a1a;--surface2:#242424;--surface3:#2e2e2e;--accent:#4f8ef7;--accent2:#7c3aed;--text:#e8e8e8;--muted:#888;--border:#333}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.2rem;height:52px;display:flex;align-items:center;gap:1rem;flex-shrink:0}
  .topbar a{color:var(--muted);text-decoration:none;font-size:.85rem}
  .topbar a:hover{color:var(--text)}
  .topbar .sep{color:var(--border)}
  .topbar .title{font-weight:600;font-size:1rem}
  .back-btn{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.25rem .85rem;font-size:.8rem;color:var(--muted);text-decoration:none}
  .back-btn:hover{color:var(--text)}
  #app{display:flex;flex:1;overflow:hidden}
  .sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:.9rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .sidebar-header span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .new-chat-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.3rem .7rem;font-size:.8rem;cursor:pointer}
  .new-chat-btn:hover{opacity:.9}
  .conv-list{flex:1;overflow-y:auto;padding:.5rem}
  .conv-item{padding:.6rem .8rem;border-radius:8px;cursor:pointer}
  .conv-item:hover{background:var(--surface2)}
  .conv-item.active{background:var(--surface3)}
  .conv-title{font-size:.85rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem}
  .conv-row{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
  .conv-menu-btn{color:var(--muted);font-size:1.1rem;cursor:pointer;flex-shrink:0;padding:0 .3rem;line-height:1;user-select:none}
  .conv-menu-btn:hover{color:var(--text)}
  .conv-menu{position:absolute;background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:.3rem;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .conv-menu div{padding:.45rem .9rem;font-size:.85rem;color:var(--text);cursor:pointer;border-radius:5px;white-space:nowrap}
  .conv-menu div:hover{background:var(--surface2)}
  .conv-empty{padding:1rem;font-size:.8rem;color:var(--muted);text-align:center}
  .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .model-bar{padding:.6rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;background:var(--surface);flex-shrink:0;flex-wrap:wrap}
  .model-bar label{font-size:.8rem;color:var(--muted)}
  .model-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.3rem .8rem;font-size:.78rem;cursor:pointer;white-space:nowrap}
  .model-btn.active{border-color:var(--accent);color:var(--accent);background:var(--surface3)}
  .model-btn:hover:not(.active){border-color:var(--muted)}
  .messages{flex:1;overflow-y:auto;padding:1.5rem 1.2rem;display:flex;flex-direction:column;gap:1rem}
  .msg{display:flex;gap:.75rem;max-width:820px}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg-bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;font-size:.9rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.user .msg-bubble{background:var(--surface3);border-color:var(--accent2)}
  .msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;margin-top:2px}
  .msg.assistant .msg-avatar{background:var(--accent)}
  .msg.user .msg-avatar{background:var(--accent2)}
  .thinking{color:var(--muted);font-style:italic;font-size:.85rem}
  .input-bar{padding:1rem 1.2rem;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;gap:.75rem;align-items:flex-end}
  .input-bar textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:.75rem 1rem;font-size:.9rem;resize:none;min-height:44px;max-height:160px;line-height:1.5;font-family:inherit}
  .input-bar textarea:focus{outline:none;border-color:var(--accent)}
  .send-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;width:44px;height:44px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .send-btn:hover{opacity:.9}
  .send-btn:disabled{opacity:.4;cursor:default}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:.5rem}
  .empty-state .big{font-size:2.5rem}
  .empty-state p{font-size:.9rem}
</style>
</head>
<body>

<div class='topbar'>
  <a href='/'>&#8592; Nexus</a>
  <span class='sep'>&middot;</span>
  <span class='title'>Admin Chat</span>
  <a class='back-btn' href='/'>&#8592; Admin Home</a>
</div>

<div id='app' style='display:flex;flex:1;overflow:hidden'>
  <div class='sidebar'>
    <div class='sidebar-header'>
      <span>Conversations</span>
      <div style='display:flex;gap:.7rem'>
        <a onclick='newChat()' style='color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:none'>New</a>
        <a onclick='openImport()' style='color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:none'>Import</a>
      </div>
    </div>
    <div class='conv-list' id='conv-list' onclick='handleConvClick(event)'>
      <div class='conv-empty'>Loading...</div>
    </div>
  </div>
  <div class='chat-area'>
    <div class='model-bar'>
      <label>Model:</label>
      <button class='model-btn' data-model='qwen/qwen3-235b-a22b-2507' onclick='setModel(this)'>Eco &middot; Qwen 3 235B</button>
      <button class='model-btn' data-model='anthropic/claude-sonnet-4-6' onclick='setModel(this)'>Claude Sonnet 4.6</button>
      <button class='model-btn' data-model='anthropic/claude-opus-4-8' onclick='setModel(this)'>Claude Opus 4.8</button>
      <button class='model-btn' data-model='deepseek/deepseek-v4-pro' onclick='setModel(this)'>DeepSeek V4 Pro</button>
      <button class='model-btn active' data-model='deepseek/deepseek-v4-pro-0813' onclick='setModel(this)'>DeepSeek V4 Pro 0813</button>
      <button class='model-btn' data-model='anthropic/claude-fable-5' onclick='setModel(this)'>Claude Fable 5</button>
      <button class='model-btn' id='web-btn' data-on='0' onclick='toggleWeb(this)'>Web: OFF</button>
    </div>
    <script>
      function toggleWeb(b){
        b.dataset.on = (b.dataset.on === '1') ? '0' : '1';
        b.textContent = 'Web: ' + (b.dataset.on === '1' ? 'ON' : 'OFF');
      }
      function webIsOn(){
        var b = document.getElementById('web-btn');
        return !!b && b.dataset.on === '1';
      }
    </script>
    <div class='messages' id='messages'>
      <div class='empty-state'>
        <div class='big'>&#x1F4AC;</div>
        <p>Select a conversation or start a new one</p>
      </div>
    </div>
    <div class='input-bar'>
      <textarea id='msg-input' placeholder='Message... (Enter to send, Shift+Enter for newline)' rows='1'></textarea>
      <button class='send-btn' id='send-btn' onclick='sendMessage()'>&#x27A4;</button>
    </div>
  </div>
</div>

<script>
const MODELS = {
  'qwen/qwen3-235b-a22b-2507':   'Qwen Eco',
  'anthropic/claude-sonnet-4-6': 'Sonnet 4.6',
  'anthropic/claude-opus-4-8':   'Opus 4.8',
  'deepseek/deepseek-v4-pro':    'DeepSeek V4 Pro',
  'deepseek/deepseek-v4-pro-0813': 'DeepSeek V4 Pro 0813',
  'anthropic/claude-fable-5':    'Fable 5'
};

let adminToken    = sessionStorage.getItem('np_admin_token');
let convIndex     = [];
let activeConv    = null;
let selectedModel = 'deepseek/deepseek-v4-pro-0813';

window.addEventListener('DOMContentLoaded', () => {
  if (!adminToken) { window.location.href = '/'; return; }
  loadConvIndex();
  const ta = document.getElementById('msg-input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });
});

async function loadConvIndex() {
  try {
    const r = await fetch('/admin-convs', {headers: {'X-Admin-Token': adminToken}});
    if (r.status === 401 || r.status === 403) { window.location.href = '/'; return; }
    convIndex = await r.json();
    renderConvList();
    if (convIndex.length) await loadConv(convIndex[0].id);
    else document.getElementById('conv-list').innerHTML = '<div class="conv-empty">No conversations yet</div>';
  } catch(e) { console.error('loadConvIndex:', e); }
}

function renderConvList() {
  const el = document.getElementById('conv-list');
  if (!convIndex.length) { el.innerHTML = '<div class="conv-empty">No conversations yet</div>'; return; }
  el.innerHTML = convIndex.map(c =>
    '<div class="conv-item' + (activeConv && c.id === activeConv.id ? ' active' : '') +
    '" data-conv-id="' + c.id + '">' +
    '<div class="conv-row">' +
    '<div class="conv-title">' + escHtml(c.title || 'Untitled') + '</div>' +
    '<span class="conv-menu-btn" data-act="menu">&#8943;</span>' +
    '</div>' +
    '<div class="conv-meta">' + escHtml(shortModel(c.model)) + ' &middot; ' + fmtDate(c.updated_at) + '</div>' +
    '</div>'
  ).join('');
}

function closeConvMenu() {
  const m = document.getElementById('conv-menu-popup');
  if (m) m.remove();
}

function openConvMenu(id, x, y) {
  closeConvMenu();
  const menu = document.createElement('div');
  menu.className = 'conv-menu';
  menu.id = 'conv-menu-popup';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  const rename = document.createElement('div');
  rename.textContent = 'Rename';
  rename.onclick = function(ev){ ev.stopPropagation(); closeConvMenu(); renameConv(id); };
  const del = document.createElement('div');
  del.textContent = 'Delete';
  del.onclick = function(ev){ ev.stopPropagation(); closeConvMenu(); deleteConv(id); };
  menu.appendChild(rename);
  menu.appendChild(del);
  document.body.appendChild(menu);
}

document.addEventListener('click', function(e){
  if (!e.target.closest('.conv-menu') && !e.target.closest('.conv-menu-btn')) closeConvMenu();
});

function handleConvClick(e) {
  const item = e.target.closest('.conv-item');
  if (!item || !item.dataset.convId) return;
  const btn = e.target.closest('.conv-menu-btn');
  if (btn) {
    e.stopPropagation();
    const r = btn.getBoundingClientRect();
    openConvMenu(item.dataset.convId, r.left - 40, r.bottom + 4);
    return;
  }
  loadConv(item.dataset.convId);
}

async function deleteConv(id) {
  const c = convIndex.find(x => x.id === id);
  if (!confirm('Delete "' + (c ? c.title : id) + '"? This cannot be undone.')) return;
  try {
    await fetch('/admin-conv-delete', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken},
      body: JSON.stringify({id: id})});
    convIndex = convIndex.filter(x => x.id !== id);
    if (activeConv && activeConv.id === id) {
      activeConv = null;
      if (convIndex.length) await loadConv(convIndex[0].id);
      else renderMessages();
    }
    renderConvList();
  } catch(e) { console.error('deleteConv:', e); }
}

async function renameConv(id) {
  const c = convIndex.find(x => x.id === id);
  const t = prompt('New title:', c ? c.title : '');
  if (!t || !t.trim()) return;
  try {
    await fetch('/admin-conv-rename', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken},
      body: JSON.stringify({id: id, title: t.trim()})});
    if (c) c.title = t.trim();
    if (activeConv && activeConv.id === id) activeConv.title = t.trim();
    renderConvList();
  } catch(e) { console.error('renameConv:', e); }
}

async function loadConv(id) {
  try {
    const r = await fetch('/admin-conv?id=' + encodeURIComponent(id), {headers: {'X-Admin-Token': adminToken}});
    if (!r.ok) return;
    activeConv = await r.json();
    if (activeConv.model) setModelById(activeConv.model);
    renderConvList();
    renderMessages();
  } catch(e) { console.error('loadConv:', e); }
}

async function saveConv() {
  if (!activeConv) return;
  activeConv.model = selectedModel;
  try {
    await fetch('/admin-convs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken},
      body: JSON.stringify({conversation: activeConv})
    });
    const r = await fetch('/admin-convs', {headers: {'X-Admin-Token': adminToken}});
    convIndex = await r.json();
    renderConvList();
  } catch(e) { console.error('saveConv:', e); }
}

function newChat() {
  activeConv = {
    id: 'adm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    title: 'New conversation',
    model: selectedModel,
    messages: []
  };
  renderConvList();
  renderMessages();
  document.getElementById('msg-input').focus();
}

function renderMessages() {
  const box = document.getElementById('messages');
  if (!activeConv || !activeConv.messages.length) {
    box.innerHTML = '<div class="empty-state"><div class="big">&#x1F4AC;</div><p>Start a new conversation</p></div>';
    return;
  }
  box.innerHTML = activeConv.messages.map(m =>
    '<div class="msg ' + m.role + '">' +
    '<div class="msg-avatar">' + modelIcon(m.model || (activeConv ? activeConv.model : '')) + '</div>' +
    '<div class="msg-bubble">' + escHtml(m.content) + '</div>' +
    '</div>'
  ).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;
  if (!activeConv) newChat();
  activeConv.messages.push({role: 'user', content: text});
  if (activeConv.title === 'New conversation') activeConv.title = text.slice(0,55);
  input.value = '';
  input.style.height = 'auto';
  renderMessages();
  const btn  = document.getElementById('send-btn');
  btn.disabled = true;
  const box  = document.getElementById('messages');
  const spin = document.createElement('div');
  spin.className = 'msg assistant';
  spin.innerHTML = '<div class="msg-avatar">' + modelIcon(selectedModel) + '</div>' +
                   '<div class="msg-bubble thinking">Thinking...</div>';
  box.appendChild(spin);
  box.scrollTop = box.scrollHeight;
  try {
    const r = await fetch('/admin-chat-proxy', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken},
      body: JSON.stringify({
        model:    selectedModel,
        messages: activeConv.messages.map(m => ({role: m.role, content: m.content})),
        web:      webIsOn()
      })
    });
    if (r.status === 401) { window.location.href = '/'; return; }
    const data  = await r.json();
    const reply = data.choices?.[0]?.message?.content
                || '[No response - model may be unavailable, try another]';
    activeConv.messages.push({role: 'assistant', content: reply, model: selectedModel});
    activeConv.model = selectedModel;
    await saveConv();
  } catch(e) {
    activeConv.messages.push({role: 'assistant', content: '[Error: ' + e.message + ']'});
    await saveConv();
  }
  btn.disabled = false;
  spin.remove();
  renderMessages();
}

function setModel(btn) {
  document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedModel = btn.dataset.model;
  if (activeConv) activeConv.model = selectedModel;
}
function setModelById(id) {
  const btn = document.querySelector('[data-model="' + id + '"]');
  if (btn) setModel(btn); else selectedModel = (MODELS[id] ? id : 'deepseek/deepseek-v4-pro-0813');
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function shortModel(id) { return MODELS[id] || (id||'').split('/').pop() || ''; }
function modelIcon(id) {
  if (!id) return '&#x1F916;';
  if (id.includes('fable') || id.includes('claude')) return '&#x1F7E0;';
  if (id.includes('deepseek')) return '&#x1F535;';
  if (id.includes('qwen'))     return '&#x1F7E2;';
  return '&#x1F916;';
}
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString(); } catch(e) { return ''; }
}

function openImport() {
  document.getElementById('import-overlay').style.display = 'flex';
  document.getElementById('import-raw').value = '';
  document.getElementById('import-title').value = '';
  document.getElementById('import-status').textContent = '';
  document.getElementById('import-raw').focus();
}
function closeImport() {
  document.getElementById('import-overlay').style.display = 'none';
}
async function doImport() {
  const raw   = document.getElementById('import-raw').value;
  const title = document.getElementById('import-title').value;
  const status = document.getElementById('import-status');
  if (!raw.trim()) { status.textContent = 'Nothing to import — paste a conversation first.'; return; }
  status.textContent = 'Importing...';
  try {
    const r = await fetch('/admin-import', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken},
      body: JSON.stringify({raw: raw, title: title})
    });
    if (r.status === 401) { window.location.href = '/'; return; }
    const d = await r.json();
    if (d.ok) {
      status.textContent = 'Imported ' + d.message_count + ' blocks.';
      await loadConvIndex();
      setTimeout(closeImport, 700);
    } else {
      status.textContent = 'Error: ' + (d.error || 'unknown');
    }
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
}

</script>

<div id='import-overlay' style='display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center'>
  <div style='background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:90%;max-width:640px;display:flex;flex-direction:column;gap:.9rem'>
    <div style='font-size:1.05rem;font-weight:600'>Import a conversation</div>
    <div style='font-size:.82rem;color:var(--muted);line-height:1.5'>Select all of a conversation elsewhere, copy it, and paste below. It will be saved to the sidebar. Splitting into your turns vs the AI's turns is best-effort.</div>
    <input id='import-title' placeholder='Title (optional)' style='background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;color:var(--text);font-size:.88rem'>
    <textarea id='import-raw' placeholder='Paste the whole conversation here...' style='background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.7rem .9rem;color:var(--text);font-size:.88rem;min-height:220px;resize:vertical;font-family:inherit;line-height:1.5'></textarea>
    <div id='import-status' style='font-size:.82rem;color:var(--muted);min-height:1.1em'></div>
    <div style='display:flex;gap:.6rem;justify-content:flex-end'>
      <button onclick='closeImport()' style='background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.55rem 1.1rem;font-size:.85rem;cursor:pointer'>Cancel</button>
      <button onclick='doImport()' style='background:var(--accent);border:none;color:#fff;border-radius:8px;padding:.55rem 1.1rem;font-size:.85rem;cursor:pointer;font-weight:600'>Import</button>
    </div>
  </div>
</div>

</body>
</html>
