<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Dev Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ccc;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px;
    }
    #login-box { width: 100%; max-width: 320px; text-align: center; }
    #login-box h1 { color: #4caf50; font-size: 18px; margin-bottom: 20px; }
    #login-box input {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid #3a3a3a;
      color: #eee;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }
    #login-box input:focus { border-color: #4caf50; }
    #login-btn {
      width: 100%;
      background: #2d6a4f;
      color: #fff;
      border: none;
      padding: 11px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    #login-btn:hover:not(:disabled) { background: #40916c; }
    #login-btn:disabled { opacity: 0.55; cursor: default; }
    #login-err { color: #e05252; font-size: 12px; margin-top: 10px; min-height: 16px; }
    #admin-wrap {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 16px 18px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }
    .top-bar h1 { color: #4caf50; font-size: 16px; }
    .top-bar a { color: #555; font-size: 12px; text-decoration: none; }
    .top-bar a:hover { color: #4caf50; }
    #status-line { font-size: 12px; color: #555; margin-bottom: 8px; min-height: 16px; }
    #devlog {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      padding: 16px 18px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.6;
      min-height: 300px;
      max-height: calc(100vh - 120px);
    }
  </style>
</head>
<body>

<div id="login-wrap">
  <div id="login-box">
    <h1>⬡ Dev Log</h1>
    <input type="password" id="p" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn" onclick="doLogin()">Enter</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="admin-wrap">
  <div class="top-bar">
    <h1>⬡ Dev Log</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="/" >← Gallery</a>
      <button class="btn" onclick="loadDevlog()" style="background:#1c1c1c;border:1px solid #3a3a3a;color:#bbb;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>
  <div id="status-line">Loading…</div>
  <div id="devlog"></div>
</div>

<script>
  let token = null;

  async function doLogin() {
    const p   = document.getElementById('p').value;
    const err = document.getElementById('login-err');
    const btn = document.getElementById('login-btn');
    err.textContent = '';
    if (!p) { err.textContent = 'Enter password.'; return; }
    btn.textContent = '…';
    btn.disabled = true;
    try {
      const r = await fetch('/admin-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: p })
      });
      const d = await r.json();
      if (d.success && d.token) {
        token = d.token;
        sessionStorage.setItem('np_admin_token', token);
        showPanel();
      } else {
        err.textContent = d.error || 'Wrong password.';
      }
    } catch (e) {
      err.textContent = 'Connection error.';
    }
    btn.textContent = 'Enter';
    btn.disabled = false;
  }

  function showPanel() {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('admin-wrap').style.display = 'flex';
    loadDevlog();
  }

  async function loadDevlog() {
    const statusEl = document.getElementById('status-line');
    const devlogEl = document.getElementById('devlog');
    statusEl.textContent = 'Loading…';
    try {
      const r = await fetch('/admin-devlog', { headers: { 'X-Admin-Token': token } });
      if (r.status === 403) {
        sessionStorage.removeItem('np_admin_token');
        location.reload();
        return;
      }
      const text = await r.text();
      devlogEl.textContent = text;
      devlogEl.scrollTop = devlogEl.scrollHeight;
      statusEl.textContent = text.split('\n').length + ' lines — refreshed ' + new Date().toLocaleTimeString();
    } catch (e) {
      statusEl.textContent = 'Error loading Dev Log.';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const stored = sessionStorage.getItem('np_admin_token');
    if (stored) {
      token = stored;
      showPanel();
    }
    document.getElementById('p').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
