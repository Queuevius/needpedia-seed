server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://filebrowser:8080/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Fix redirects
        proxy_redirect http://filebrowser:8080/files/ /;
        sub_filter_once off;
        sub_filter 'href="/files/' 'href="/';
        sub_filter 'src="/files/' 'src="/';
    }

    location /api/ {
        proxy_pass http://filebrowser:8080/api/;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://filebrowser:8080/static/;
    }

    location /gallery.html {
        proxy_pass http://filebrowser:8080/gallery.html;
    }
}
