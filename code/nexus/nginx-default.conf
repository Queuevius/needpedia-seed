server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 20M;

    location ~* ^/(CAPABILITIES|nexus-context|needpedia-context)\.md$ {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /DEVLOG.md {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }

    # PUBLIC FOLDER (N42): .md files in /public/ are readable by anyone.
    # Names containing "handoff" stay blocked. Subfolders stay blocked.
    location ~* ^/public/(?!.*handoff)[^/]+\.md$ {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # DENYBLOCK
    location ~* \.(py|db|sqlite3?|sh|ya?ml|conf|md|log|pem|dockerfile)($|\.) { deny all; return 404; }
    location ~* \.bak { deny all; return 404; }
    location ~* (handoff|pre-auth|htpasswd|docker-compose|nginx-default|order-server|\.(yml|yaml|py|env|sh)$) { deny all; return 404; }
    location ~ /__ { deny all; return 404; }
    location = /volunteers.json { deny all; return 404; }
    location ^~ /kb/ { deny all; return 404; }
    location ^~ /volunteer-logs/ { deny all; return 404; }

    location ~ /\. { deny all; return 404; }
    location ^~ /config/ { deny all; return 404; }

    location = /save-order {
        proxy_pass http://order-server:8181/save-order;
        proxy_set_header Content-Type application/json;
    }
    location = /volunteer-auth {
        proxy_pass http://order-server:8181/volunteer-auth;
        proxy_set_header Content-Type application/json;
    }
    location = /volunteer-log {
        proxy_pass http://order-server:8181/volunteer-log;
        proxy_set_header Content-Type application/json;
    }
    location = /save-text {
        proxy_pass http://order-server:8181/save-text;
        proxy_set_header Content-Type application/json;
    }
    location = /save-image {
        proxy_pass http://order-server:8181/save-image;
        proxy_set_header Content-Type application/json;
    }
    location = /admin-auth {
        proxy_pass http://order-server:8181/admin-auth;
        proxy_set_header Content-Type application/json;
    }
    location = /admin-devlog {
        proxy_pass http://order-server:8181/admin-devlog;
    }
    location = /admin-ops {
        proxy_pass http://order-server:8181/admin-ops;
        proxy_set_header Content-Type application/json;
    }
    location = /folder-upload {
        client_max_body_size 1024M;
        proxy_pass http://order-server:8181/folder-upload;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
    location = /admin-browse {
        proxy_pass http://order-server:8181/admin-browse;
    }
    location = /admin-file {
        proxy_pass http://order-server:8181/admin-file;
    }
    location = /admin-delete {
        proxy_pass http://order-server:8181/admin-delete;
        proxy_set_header Content-Type application/json;
    }

    location = /admin-import {
        proxy_pass http://order-server:8181/admin-import;
    }

    location = /admin-chat-proxy {
        proxy_pass http://order-server:8181/admin-chat-proxy;
    }

    location = /volunteer-chat-proxy {
        proxy_pass http://order-server:8181/volunteer-chat-proxy;
    }

    location = /admin-convs {
        proxy_pass http://order-server:8181/admin-convs;
    }
    location = /volunteer-convs {
        proxy_pass http://order-server:8181/volunteer-convs;
    }
    location = /volunteer-conv {
        proxy_pass http://order-server:8181/volunteer-conv;
    }

    location = /admin-conv {
        proxy_pass http://order-server:8181/admin-conv;
    }

    location = /admin-activity {
        proxy_pass http://order-server:8181/admin-activity;
    }

    location = /admin-conv-delete {
        proxy_pass http://order-server:8181/admin-conv-delete;
    }

    location = /capture {
        proxy_pass http://order-server:8181/capture;
    }
    location ^~ /master_uploads/ {
        deny all;
        return 404;
    }
    location /terminal/ {
        auth_basic "Nexus";
        auth_basic_user_file /usr/share/nginx/html/config/.htpasswd;
        proxy_pass http://ttyd-server:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
    location = / {
        try_files /gallery.html =404;
    }
    location ~* \.html$ {
        add_header Content-Type "text/html; charset=utf-8";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
        autoindex off;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
